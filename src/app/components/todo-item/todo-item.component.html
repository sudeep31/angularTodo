<div class="flex items-start gap-4 p-4 bg-white border border-gray-200 rounded-lg shadow-sm">
  <!-- Checkbox -->
  <input
    type="checkbox"
    [id]="'todo-' + todo().id"
    [checked]="todo().completed"
    [disabled]="disabled()"
    (change)="onToggleComplete()"
    class="mt-1 h-4 w-4 shrink-0 cursor-pointer accent-blue-500"
    [attr.aria-label]="'Mark ' + todo().title + ' as ' + (todo().completed ? 'incomplete' : 'complete')"
  />

  <!-- Content -->
  <div class="flex-1 min-w-0">
    <p class="font-medium text-gray-900" [class.line-through]="todo().completed" [class.text-gray-400]="todo().completed">
      {{ todo().title }}
    </p>

    @if (todo().description) {
      <p class="mt-1 text-sm text-gray-500">{{ todo().description }}</p>
    }

    <div class="mt-2 flex flex-wrap items-center gap-2 text-xs">
      <!-- Priority badge -->
      <span
        class="px-2 py-0.5 rounded-full font-medium"
        [class.bg-red-100]="todo().priority === 'high'"
        [class.text-red-700]="todo().priority === 'high'"
        [class.bg-yellow-100]="todo().priority === 'medium'"
        [class.text-yellow-700]="todo().priority === 'medium'"
        [class.bg-green-100]="todo().priority === 'low'"
        [class.text-green-700]="todo().priority === 'low'">
        {{ todo().priority | titlecase }} priority
      </span>

      <!-- Due date -->
      @if (todo().dueDate) {
        <span class="text-gray-500">Due: {{ todo().dueDate | date:'mediumDate' }}</span>
      }

      <!-- Tags -->
      @if (todo().tags?.length) {
        @for (tag of todo().tags!; track tag) {
          <span class="px-2 py-0.5 bg-gray-100 text-gray-600 rounded-full">{{ tag }}</span>
        }
      }
    </div>
  </div>

  <!-- Actions -->
  <div class="flex items-center gap-1 shrink-0">
    <button
      type="button"
      (click)="onEdit()"
      [disabled]="disabled()"
      class="p-1.5 text-gray-400 hover:text-blue-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors disabled:opacity-40"
      aria-label="Edit todo">
      ✏️
    </button>
    <button
      type="button"
      (click)="onDelete()"
      [disabled]="disabled()"
      class="p-1.5 text-gray-400 hover:text-red-600 rounded focus:outline-none focus:ring-2 focus:ring-red-500 transition-colors disabled:opacity-40"
      aria-label="Delete todo">
      🗑️
    </button>
  </div>
</div>
