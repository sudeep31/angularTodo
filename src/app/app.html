<div class="min-h-screen bg-slate-50">
  <!-- Skip link — WCAG 2.4.1: allows keyboard users to bypass the nav -->
  <a
    href="#main-content"
    class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-blue-600 focus:text-white focus:rounded-lg focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-300">
    Skip to main content
  </a>

  <!-- Navigation -->
  <nav aria-label="Primary" class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 sm:px-6">
      <div class="flex justify-between items-center h-14">
        <h1 class="text-base font-semibold text-gray-800">{{ title() }}</h1>
        <div class="flex items-center gap-4">
          <a routerLink="/" class="text-sm text-gray-600 hover:text-gray-900 transition-colors">Todos</a>
          <a routerLink="/contact" class="text-sm text-gray-600 hover:text-gray-900 transition-colors">Contact</a>
          <span class="text-xs text-gray-400" aria-hidden="true">Angular 21 · Signals · TailwindCSS</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main id="main-content" class="max-w-3xl mx-auto px-4 sm:px-6 py-8" tabindex="-1">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer aria-label="Site information" class="py-6 border-t border-gray-100">
    <div class="max-w-3xl mx-auto px-4 sm:px-6">
      <p class="text-center text-xs text-gray-400">Built with Angular 21, Signals &amp; TailwindCSS</p>
    </div>
  </footer>
</div>
